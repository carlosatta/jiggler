name: Release firmware

# When a release is published, build the firmware and attach it. Devices look for the asset named
# jiggler-esp32.bin (and its .sha256) on the latest release of the repository.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: The tag matches the firmware version
        run: |
          VERSION=$(sed -n 's/.*JIG_VERSION=\\"\([0-9][0-9.]*\)\\".*/\1/p' platformio.ini | head -1)
          TAG="${GITHUB_REF_NAME}"
          echo "platformio.ini says $VERSION, the release tag is $TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::The tag must be v$VERSION (the version in platformio.ini). Update JIG_VERSION, or tag again."
            exit 1
          fi
      - name: Host unit tests
        run: pio test -e native
      - name: Build the firmware
        run: pio run -e esp32
      - name: Attach the firmware and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .pio/build/esp32/firmware.bin jiggler-esp32.bin
          sha256sum jiggler-esp32.bin > jiggler-esp32.bin.sha256
          cat jiggler-esp32.bin.sha256
          gh release upload "$GITHUB_REF_NAME" jiggler-esp32.bin jiggler-esp32.bin.sha256 --clobber
