name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install platformio
      - name: Generated web assets are current
        run: python3 tools/build_web.py --check
      - name: Dashboard helpers
        run: node --test web/test/*.test.js
      - name: Host unit tests
        run: pio test -e native
      - name: Firmware builds
        run: pio run -e esp32
