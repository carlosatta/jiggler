[platformio]
default_envs = esp32

[env:esp32]
extra_scripts = pre:tools/pio_web.py
platform = espressif32@^6.9.0
board = esp32dev
board_build.partitions = partitions.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DJIG_VERSION=\"0.7.5\" -DCONFIG_BT_NIMBLE_MAX_BONDS=5
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.0
    mathieucarbou/ESPAsyncWebServer@^3.3.0
    tzapu/WiFiManager@^2.0.17

[env:native]
extra_scripts = pre:tools/pio_web.py
platform = native
build_flags = -std=gnu++17 -I test/support -I src
lib_deps = bblanchon/ArduinoJson@^7.2.0
